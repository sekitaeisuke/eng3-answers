<style>
:root { --bg:#fffdf8; --card:#fff; --ink:#2b2620; --sub:#8a5a2b; --line:#e9dcc2;
        --brand:#b5651d; --accbg:#eef6ef; --chip:#faf4e8; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#191512; --card:#221d18; --ink:#ece3d6; --sub:#d3a56a; --line:#3a3128;
          --brand:#e0913f; --accbg:#1e2a22; --chip:#241f18; } }
* { box-sizing:border-box; }
body { margin:0; padding:16px 14px 132px; background:var(--bg); color:var(--ink);
       font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
       line-height:1.7; -webkit-text-size-adjust:100%; }
.wrap { max-width:720px; margin:0 auto; }
h1 { font-size:1.25rem; margin:0 0 2px; color:var(--brand); }
.sub { color:var(--sub); font-size:.85rem; margin:0 0 18px; }
h2 { font-size:1rem; margin:26px 0 10px; padding:7px 12px; background:var(--chip);
     border-left:5px solid var(--brand); border-radius:0 8px 8px 0; }
.note { background:var(--accbg); border:1px solid var(--line); border-radius:10px;
        padding:11px 13px; font-size:.85rem; margin:0 0 18px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:9px; }
.units { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:9px; }
.row { display:flex; align-items:center; gap:8px; background:var(--card);
       border:1px solid var(--line); border-radius:11px; padding:8px 9px; }
.no { font-weight:700; font-size:.95rem; min-width:2.6em; color:var(--brand); }
.no.mono { font-size:.78rem; min-width:5.6em; }
button { flex:1; font:inherit; font-size:.82rem; padding:7px 4px; cursor:pointer;
         border:1px solid var(--line); border-radius:8px; background:var(--chip);
         color:var(--ink); -webkit-tap-highlight-color:transparent; }
button:active { transform:translateY(1px); }
button.slow { flex:0 0 auto; padding:7px 9px; }
button[aria-pressed="true"] { background:var(--brand); color:#fff; border-color:var(--brand); }
a.unit { display:block; background:var(--card); border:1px solid var(--line);
         border-radius:11px; padding:11px 13px; text-decoration:none; color:var(--ink); }
a.unit b { color:var(--brand); display:block; font-size:.8rem; }
.back { display:inline-block; margin:0 0 14px; color:var(--brand); font-size:.85rem; }
#player { position:fixed; left:0; right:0; bottom:0; background:var(--card);
          border-top:2px solid var(--brand); padding:9px 14px 12px; }
#player .inner { max-width:720px; margin:0 auto; }
#now { font-size:.85rem; color:var(--sub); margin:0 0 5px; }
audio { width:100%; height:38px; }
</style></head>

<script>
var A=document.getElementById('a'),N=document.getElementById('now'),cur=null;
function play(base,id,slow,btn){
  if(cur){cur.setAttribute('aria-pressed','false');}
  btn.setAttribute('aria-pressed','true');cur=btn;
  A.src=base+'/'+id+(slow?'-slow':'')+'.mp3';
  N.textContent=btn.getAttribute('data-label')+(slow?'（ゆっくり）':'')+' を再生中';
  A.play().catch(function(){N.textContent='もう一度ボタンを押してください';});
}
</script>
